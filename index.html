<style>
:root{--ink:#1d1610;--gold:#c9a86a;--bg:#1d1610;--card:#252017;--red:#c0392b;--dim:#a89783}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",serif;background:var(--bg);color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:480px;padding:24px 20px 60px}

form{background:var(--card);border:1px solid #352a1d;border-radius:16px;padding:22px}
.row{display:flex;gap:10px;margin-bottom:14px}

.card{background:linear-gradient(160deg,#2a2117,#231b12);border:1px solid var(--gold);border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}

.pillars{display:flex;justify-content:space-between;margin:18px 4px 8px;padding:0 6px}
.plr{text-align:center;flex:1}
.plr .lbl{font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:8px}

.portrait .po-glow{position:absolute;top:-60px;left:50%;width:260px;height:260px;transform:translateX(-50%);background:radial-gradient(circle,rgba(201,168,106,.22),transparent 70%);pointer-events:none;animation:poFade 2.4s ease}
.portrait .po-kicker{font-size:12px;color:rgba(201,168,106,.55);letter-spacing:6px;text-transform:uppercase;margin-bottom:14px;animation:poFade 1.6s ease}
.portrait .po-open{font-size:21px;color:var(--gold);letter-spacing:2px;font-weight:300;margin-bottom:18px;line-height:1.7;animation:poFade 1.8s ease}
.portrait .po-body{font-size:15px;color:var(--text);line-height:2.2;text-align:left;padding:0 8px}
.portrait .po-body p{opacity:0;animation:poFade 1.4s ease forwards}
.portrait .po-body p:nth-child(1){animation-delay:.3s}
.portrait .po-body p:nth-child(2){animation-delay:.7s}
.portrait .po-body p:nth-child(3){animation-delay:1.1s}
.portrait .po-quote{font-size:20px;color:#eeddb0;letter-spacing:1px;font-style:italic;margin:22px 0 8px;line-height:1.8;opacity:0;animation:poFade 1.6s ease 1.6s forwards}
.portrait .po-meta{font-size:12px;color:var(--dim);letter-spacing:1px;margin-top:16px}
/* 国风问卦 */

.gua-title span{color:var(--red);font-size:16px;margin-right:6px}
.gua-sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:12px;letter-spacing:1px}
.gua-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}

.gua-seal{width:30px;height:30px;line-height:30px;background:var(--red);color:#f5efe2;border-radius:6px;margin:0 auto 6px;font-size:16px;text-align:center}
.gua-poem{font-size:14px;color:#e9d9a8;font-style:italic;margin:4px 0;letter-spacing:1px}

<div class="share-actions" style="margin-top:6px;text-align:center">
<button id="btn-zw-card" type="button" style="width:auto;padding:9px 20px;font-size:14px;border-radius:999px;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold);background:transparent">生成紫微分享卡</button>

<button id="btn-card" type="button" style="width:auto;padding:10px 22px;font-size:14px;border-radius:999px;letter-spacing:1px">生成分享卡</button>

/* 年月柱 */
function monthYear(y,m,d){
  const md=(m*100+d);

  else if(md<204){py=y-1;mz=1}

function wrapText(x,text,cx,y,maxW,lh){

    case "事业": txt = dm?("日主属"+dm+"命,"+({"木":"宜专精深耕,以积累成势","火":"宜顺势而上,借声势前行","土":"宜守正固本,厚积而薄发","金":"宜果决进取,凭实力立足","水":"宜灵活变通,借人脉成事"}[dm]||"")):"官星为事业根基,宜循正途而进"; break;
    case "情感": txt = "日支为婚姻宫,看其对日主的生扶;夫妻之道,贵在相互成全与体谅。"; break;
    case "财富": txt = dm?("日主"+dm+"命,"+({"木":"财居东南,宜以才华生财","火":"财动而旺,宜抓住时机","土":"财稳而实,宜正财积累","金":"财利坚韧,宜凭实力聚财","水":"财活而通,宜以智取财"}[dm]||"")):"财星为养身之源,正财为根本,偏财为机遇"; break;
    case "健康": txt = "日元"+ (window.__strength||"中和") +"为体质基调"; if(window.__missing&&window.__missing.length) txt+="，五行略欠"+window.__missing.join("、")+"，调养宜从所补"; break;
    case "家人": txt="印星主父母长辈,比劫主手足;家宅安宁,是人生最稳的根。"; break;
    case "学业": txt=(dm?("日主"+dm+"命,印星主学识智谋"):"印星为学业根基,文昌助力")+"宜静心向学,专精一艺"; break;
    case "桃花": txt="桃花星主异性缘,逢之则人缘增旺;情缘之事,贵在真诚相待。"; break;
  }
  return txt;
}
/* ===== 国风问卦: 卦签UI + 求签详情 ===== */
function renderGua(){
  var kinds=["事业","情感","财富","健康","家人","学业","桃花"];
  var html='<div class="gua-title"><span>玄</span> 国 风 问 卦</div>'
    +'<div class="gua-sub">想知一隅，随缘测签；不知所问，全部细看</div>'
    +'<div class="gua-grid">';
  kinds.forEach(function(k){
    var m=GUA_META[k];
    html+='<button class="gua-card" data-kind="'+k+'"><div class="gua-ic">'+m.icon+'</div><div>'+k+'</div></button>';
  });
  html+='<button class="gua-card gua-all" data-kind="全部"><div class="gua-ic">☯</div><div>全部细看</div></button>';
  html+='<button class="gua-card gua-sui" data-kind="随缘"><div class="gua-ic">签</div><div>随缘一签</div></button>';
  html+='</div><div id="gua-result"></div>';
  document.getElementById("gualist").innerHTML=html;
  var cards=document.querySelectorAll(".gua-card");
  cards.forEach(function(c){ c.addEventListener("click",function(){
    c.classList.add("flipping");
    var k=c.getAttribute("data-kind");
    setTimeout(function(){ guessGua(k); c.classList.remove("flipping"); },430);
  }); });
}
function guessGua(kind){
  var kinds=["事业","情感","财富","健康","家人","学业","桃花"];
  if(kind==="随缘") kind=kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==="全部"){
    var allXml="";
    kinds.forEach(function(k){ allXml+=guaDetailHtml(k); });
    document.getElementById("gua-result").innerHTML=
      '<div class="gua-result-block"><div class="gua-seal">全</div>'
      +'<div class="gua-hd">人生六问 · 一一细看</div>'+allXml+'</div>';
    return;
  }
  document.getElementById("gua-result").innerHTML=guaDetailHtml(kind);
}
function guaDetailHtml(kind){
  var m=GUA_META[kind], a=collectGuaArea(kind), stars=a.stars;
  var dm=window.__dmWX||"";
  var poem=guaPoem(kind,dm);
  var base=GUABONUS[kind]? (GUABONUS[kind][dm]||0) : 0;
  var tier=guaLevel(stars.length, 45+base);
  var bazi=renderGuaBazi(kind);
  var starTxt=stars.length?stars.join("+"):"无主星，较平稳";
  var starGist=stars.length?stars.map(function(s){return s+":"+(ZW_STAR_GIST[s]||"主星");}).join("  "):"此宫无主星，运势平顺处之";
  var html='<div class="gua-item"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<span class="gua-ic2">'+m.icon+'</span><b style="color:var(--gold);font-size:16px">'+kind+' · '+m.ziwei+'</b>'
    +'<span style="margin-left:auto;color:'+(tier[0]==="上上签"||tier[0]==="上签"?tier[0]==="上上签"?"var(--red)":"var(--gold)":"#a89783")+'">'+tier[0]+'</span></div>'
    +'<div class="gua-poem">「'+poem+'」</div>'
    +'<div class="gua-desc">'+starGist+'。'+bazi+'</div>'
    +'<div style="text-align:right;margin-top:6px"><button class="gua-share" data-kind="'+kind+'" data-tier="'+tier[0]+'" data-poem="'+poem+'" data-star="'+starTxt+'">存为卦签图 ↧</button></div>'
    +'</div>';
  return html;
}

  var img=document.createElement("img");img.src=c.toDataURL("image/png");img.style.width="100%";img.style.borderRadius="10px";img.style.marginTop="8px";

document.getElementById("btn-detail").addEventListener("click",()=>{
